# /opt/edge/conf.d/iliashakeri.conf — route iliashakeri.ir through edge-nginx-1.
#
# ArvanCloud terminates HTTPS for visitors. It may connect to this server over
# HTTP:80 or HTTPS:443 depending on the panel's origin-protocol setting, so the
# block answers on both. On 443 it reuses the certificate the edge already
# mounts for Dolphin; without this, an HTTPS origin request would fall through
# to Dolphin's default_server and return Dolphin's 400 page.
# `set` + a variable makes nginx resolve the container at request time through
# Docker's DNS (the resolver is declared in dolphin.conf), so the edge still
# starts if the portfolio container is down.
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name iliashakeri.ir www.iliashakeri.ir;
    server_tokens off;
    client_max_body_size 64k;

    if ($host = www.iliashakeri.ir) {
        return 301 https://iliashakeri.ir$request_uri;
    }

    set $iliashakeri_backend iliashakeri-web-1:8080;

    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://$iliashakeri_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
