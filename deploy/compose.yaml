# Portfolio static site on the Iran VPS (/opt/iliashakeri).
#
# update-site.sh (run by iliashakeri-update.timer) pulls the built site from
# the `site` branch into ./site; nginx serves it read-only, so updates need no
# restart. No host port is published: edge-nginx-1 reaches this container as
# iliashakeri-web-1:8080 over the shared `iliashakeri-edge` network.
#
#   docker network create iliashakeri-edge        # once
#   docker network connect iliashakeri-edge edge-nginx-1
#   docker compose up -d
name: iliashakeri

services:
  web:
    image: nginx:1.27-alpine
    container_name: iliashakeri-web-1
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "101:101"
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
      - /tmp:uid=101,gid=101
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    name: iliashakeri-edge
    external: true
