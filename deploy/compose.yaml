# Portfolio static site. The GitHub Actions deploy workflow rsyncs the build
# into ./site; nginx serves it read-only, so content updates need no restart.
#
#   cd /srv/iliashakeri.ir && docker compose up -d
#
# The container listens only on 127.0.0.1:8088. Point your existing reverse
# proxy (Nginx, Caddy, Traefik) at it for iliashakeri.ir — see
# docs/deployment.md.
name: iliashakeri

services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "101:101"
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
      - /tmp:uid=101,gid=101
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8088:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
