name: Deploy

# Builds the static site and publishes it as a single commit on the `site`
# branch. The Iran VPS pulls that branch every two minutes
# (deploy/update-site.sh), so GitHub never needs to reach the server.
# Setup: docs/deployment.md.
#
# Optional repository variable SMOKE_URL (e.g. https://iliashakeri.ir): after
# publishing, wait until the live site serves this build.

on:
  push:
    branches: [main]
  # Rebuild every six hours so the GitHub figures on /projects/ (latest
  # release, last activity) stay current without a code change.
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish site branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    environment:
      name: production
      url: ${{ vars.SMOKE_URL || 'https://iliashakeri.ir' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Refresh GitHub figures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-stats.mjs

      - name: Build static export
        run: npm run build

      - name: Check exported artifacts
        run: |
          for file in index.html resume/index.html resume/ilia-shakeri-resume.pdf 404.html; do
            test -s "out/$file" || { echo "missing out/$file"; exit 1; }
          done
          # Build marker for the smoke test and for checking what is live.
          echo "$GITHUB_SHA" > out/build.txt

      - name: Publish to the site branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init --quiet --initial-branch=site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet -m "Site build from ${GITHUB_SHA}"
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          echo "Published ${GITHUB_SHA} to the site branch"

      - name: Wait for the live site
        if: ${{ vars.SMOKE_URL != '' }}
        env:
          URL: ${{ vars.SMOKE_URL }}
        run: |
          # The VPS checks every two minutes; give it up to ten.
          for attempt in $(seq 1 40); do
            live=$(curl -fsS --max-time 15 "$URL/build.txt?ts=$(date +%s)" 2>/dev/null || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              curl -fsS --max-time 20 "$URL/" | grep -q "Ilia Shakeri" || { echo "home page content check failed"; exit 1; }
              echo "Live site serves ${GITHUB_SHA}"
              exit 0
            fi
            sleep 15
          done
          echo "Live site still serves '${live:-nothing}' after 10 minutes"
          exit 1
