name: Deploy

# Builds the static site and rsyncs it to the VPS, where the nginx container
# from deploy/compose.yaml serves it. Setup: docs/deployment.md.
#
# Repository variables: DEPLOY_HOST (enables this workflow), DEPLOY_USER,
#   DEPLOY_PATH (e.g. /srv/iliashakeri.ir), optional DEPLOY_PORT, SMOKE_URL.
# Repository secrets:   DEPLOY_SSH_KEY (private key), DEPLOY_KNOWN_HOSTS.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to VPS
    if: ${{ vars.DEPLOY_HOST != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.SMOKE_URL || 'https://iliashakeri.ir' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Check exported artifacts
        run: |
          for file in index.html resume/index.html resume/ilia-shakeri-resume.pdf 404.html; do
            test -s "out/$file" || { echo "missing out/$file"; exit 1; }
          done

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" || { echo "DEPLOY_SSH_KEY secret is not set"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "DEPLOY_KNOWN_HOSTS secret is not set"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload site
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER_NAME: ${{ vars.DEPLOY_USER }}
          PORT: ${{ vars.DEPLOY_PORT || '22' }}
          TARGET: ${{ vars.DEPLOY_PATH }}
        run: |
          test -n "$USER_NAME" && test -n "$TARGET" || { echo "DEPLOY_USER and DEPLOY_PATH variables are required"; exit 1; }
          # Keep old /_next/static chunks (P = protect from --delete) so pages
          # still cached by a browser or the CDN never reference a missing file.
          rsync -az --delete --delay-updates \
            --filter='P /_next/static/**' \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes" \
            out/ "$USER_NAME@$HOST:$TARGET/site/"

      - name: Smoke test
        if: ${{ vars.SMOKE_URL != '' }}
        env:
          URL: ${{ vars.SMOKE_URL }}
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 20 "$URL/" | grep -q "Built to ship" \
            || { echo "home page did not return the expected content"; exit 1; }
          curl -fsS --max-time 20 -o /dev/null "$URL/resume/ilia-shakeri-resume.pdf"
          echo "Smoke test passed for $URL"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
