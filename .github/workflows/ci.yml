name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build, regression, browser and artifact checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm test
      - run: npm run check
        env:
          NEXT_PUBLIC_SITE_URL: https://iliashakeri.ir
      - run: npm run check:artifacts
      - run: npm run qa:screens
      - run: npm run check:links
      - name: Keep verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: |
            qa-artifacts/
            out/build-info.json
          retention-days: 14
      - name: Keep tested static export
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: out/
          retention-days: 7
  live:
    name: Verify the same commit on the public domain
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/smoke-live.mjs
        env:
          SMOKE_URL: https://iliashakeri.ir
          EXPECTED_SHA: ${{ github.sha }}
