name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, and static build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}

      - name: Check exported artifacts
        run: |
          for file in index.html resume/index.html resume/ilia-shakeri-resume.pdf robots.txt sitemap.xml og-image.png 404.html; do
            test -s "out/$file" || { echo "missing out/$file"; exit 1; }
          done
          head -c 5 out/resume/ilia-shakeri-resume.pdf | grep -q '%PDF-' || { echo "résumé is not a PDF"; exit 1; }

      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          retention-days: 7
