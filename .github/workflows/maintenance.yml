name: Public link and dependency checks
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run check:links -- --live https://iliashakeri.ir
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-link-receipt
          path: qa-artifacts/link-check.json
          retention-days: 14
